<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#477d3d">
  <title>Çiftka Min — Benim Çiftliğim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">🌻</span><div><strong>Çiftka Min</strong><small>Benim çiftliğim</small></div></div>
      <div class="resources"><span>🪙 <b id="coins">1.250</b></span><span>💎 <b id="gems">25</b></span><span>⭐ <b id="level">1</b></span></div>
      <button class="round-btn" id="settingsBtn" aria-label="Ayarlar">⚙</button>
    </header>

    <section class="scene-wrap">
      <div class="scene" id="farmScene">
        <div class="sky"></div><div class="distant-hills"></div>
        <div class="farm-ground"></div>
        <div class="river"></div>
        <div class="path path-one"></div><div class="path path-two"></div>
        <div class="tree tree-a">🌳</div><div class="tree tree-b">🌲</div><div class="tree tree-c">🌳</div><div class="tree tree-d">🌳</div>
        <div class="plot plot-one" data-plot="0"><span>🌱</span><small>Buğday</small></div>
        <div class="plot plot-two" data-plot="1"><span>🥕</span><small>Havuç</small></div>
        <div class="plot plot-three" data-plot="2"><span>🌽</span><small>Mısır</small></div>
        <div class="barn building" data-building="barn"><div class="roof"></div><div class="barn-body"><span>✦</span><b>AHIR</b><i></i></div><label>Awr</label></div>
        <div class="coop building" data-building="coop"><div class="coop-roof"></div><div class="coop-body"><span>✿</span></div><label>Mirîşk</label></div>
        <div class="mill building" data-building="mill"><div class="mill-roof">✣</div><div class="mill-body">🏡</div><label>Değirmen</label></div>
        <div class="fence fence-a"></div><div class="fence fence-b"></div>
        <button class="animal cow" data-animal="cow" aria-label="İnek"><span class="animal-shadow"></span><span class="animal-art"><svg viewBox="0 0 120 100" role="img" aria-label="İnek çizimi"><ellipse cx="59" cy="80" rx="39" ry="8" fill="#42623b" opacity=".25"/><path d="M30 37Q34 19 57 21L82 29Q93 37 89 66L81 78H39L29 64Z" fill="#f7f0df" stroke="#594b3b" stroke-width="3"/><path d="M43 27L54 34 47 47 34 43Z M70 32L83 37 78 51 65 45Z" fill="#55463d"/><path d="M31 38Q16 29 12 43L19 58 34 55Z" fill="#f4ead8" stroke="#594b3b" stroke-width="3"/><path d="M85 36Q104 27 109 43L101 58 87 54Z" fill="#f4ead8" stroke="#594b3b" stroke-width="3"/><path d="M37 68L35 91 44 91 48 70M72 69L74 91 83 91 82 66" fill="#f3ead8" stroke="#594b3b" stroke-width="3"/><path d="M46 53Q60 43 78 54L80 67Q63 78 44 66Z" fill="#e99b91" stroke="#594b3b" stroke-width="3"/><circle cx="54" cy="57" r="2.5" fill="#40352d"/><circle cx="70" cy="57" r="2.5" fill="#40352d"/><path d="M57 66Q62 70 67 66" fill="none" stroke="#8a4d48" stroke-width="2"/><path d="M43 22L36 10 52 17M78 24L89 12 91 30" fill="#f2dfbd" stroke="#594b3b" stroke-width="3"/></svg></span><small>Ga</small></button>
        <button class="animal sheep" data-animal="sheep" aria-label="Koyun"><span class="animal-shadow"></span><span class="animal-art"><svg viewBox="0 0 120 100" role="img" aria-label="Koyun çizimi"><ellipse cx="60" cy="82" rx="38" ry="7" fill="#42623b" opacity=".25"/><g fill="#fff9e9" stroke="#c8bda7" stroke-width="2"><circle cx="37" cy="42" r="19"/><circle cx="55" cy="31" r="20"/><circle cx="75" cy="39" r="20"/><circle cx="82" cy="57" r="18"/><circle cx="57" cy="60" r="22"/><circle cx="34" cy="61" r="16"/></g><path d="M79 42Q100 37 104 56L98 72 78 69 70 57Z" fill="#d99d88" stroke="#654d45" stroke-width="3"/><circle cx="94" cy="52" r="3" fill="#302b29"/><path d="M43 72L42 91H49L53 73M70 72L72 91H79L78 70" fill="#f4ead8" stroke="#65594c" stroke-width="3"/><path d="M82 44L76 31 90 39M101 44L109 33 109 51" fill="#d99d88" stroke="#654d45" stroke-width="2"/></svg></span><small>Pez</small></button>
        <button class="animal chicken" data-animal="chicken" aria-label="Tavuk"><span class="animal-shadow"></span><span class="animal-art"><svg viewBox="0 0 120 100" role="img" aria-label="Tavuk çizimi"><ellipse cx="58" cy="83" rx="29" ry="6" fill="#42623b" opacity=".25"/><path d="M35 42Q37 22 58 25Q83 25 83 54Q83 76 59 78Q34 75 35 42Z" fill="#fff8e8" stroke="#8b6740" stroke-width="3"/><path d="M53 28Q42 13 52 9Q62 7 61 21Q69 6 77 15Q82 24 67 30" fill="#d95042" stroke="#9e3b31" stroke-width="2"/><path d="M78 45L98 52 78 59Z" fill="#e9a936" stroke="#9d6d28" stroke-width="2"/><circle cx="72" cy="40" r="4" fill="#302b29"/><path d="M43 77L42 91M64 77L66 91M36 91H49M60 91H73" stroke="#d99a32" stroke-width="4" stroke-linecap="round"/><path d="M35 51Q15 37 21 60Q27 72 40 65" fill="#f0e1bf" stroke="#8b6740" stroke-width="2"/></svg></span><small>Dîk</small></button>
        <button class="animal horse" data-animal="horse" aria-label="At"><span class="animal-shadow"></span><span class="animal-art"><svg viewBox="0 0 120 100" role="img" aria-label="At çizimi"><ellipse cx="59" cy="83" rx="39" ry="7" fill="#42623b" opacity=".25"/><path d="M28 42Q39 24 72 32L85 46 78 65 47 70 33 61Z" fill="#a9683f" stroke="#573d30" stroke-width="3"/><path d="M72 36Q80 14 96 17L106 29 99 48 81 53Z" fill="#a9683f" stroke="#573d30" stroke-width="3"/><path d="M88 19L84 7 96 14 103 8 105 25" fill="#573d30"/><path d="M40 65L37 91H45L51 68M68 65L72 91H80L78 63" fill="#8b5435" stroke="#573d30" stroke-width="3"/><path d="M31 43Q13 35 17 58L27 68" fill="none" stroke="#573d30" stroke-width="5" stroke-linecap="round"/><circle cx="96" cy="29" r="3" fill="#29221e"/><path d="M98 42Q105 46 109 40" fill="none" stroke="#573d30" stroke-width="2"/></svg></span><small>Hesp</small></button>
        <div class="truck"><span>🚚</span><small>Karwan</small></div>
        <div class="signpost">ÇIFTKA MIN</div>
        <div class="scene-hint" id="sceneHint">Çiftliğine dokun ve keşfet!</div>
      </div>
      <div class="scene-controls"><button id="zoomOut">−</button><button id="zoomIn">＋</button><button id="homeView">⌂</button></div>
    </section>

    <section class="quest-strip">
      <div><small>GÖREV / ERKA</small><strong id="questText">2 yumurta topla</strong></div>
      <div class="quest-progress"><span id="questProgress"></span></div>
      <b id="questCount">0/2</b>
      <button id="questClaim" disabled>Ödül</button>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item active" data-panel="farm"><span>🏡</span><small>Çiftlik</small></button>
      <button class="nav-item" data-panel="orders"><span>🚚</span><small>Sipariş</small></button>
      <button class="nav-item" data-panel="market"><span>🏪</span><small>Pazar</small></button>
      <button class="nav-item" data-panel="mine"><span>⛏️</span><small>Maden</small></button>
      <button class="nav-item" data-panel="more"><span>☰</span><small>Daha fazla</small></button>
    </nav>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="game.js"></script>
</body>
</html>
